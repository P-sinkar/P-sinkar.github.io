# ------------------------------------------------------------
# Site settings — edit these freely.
# ------------------------------------------------------------
title: Pranav Sinkar
description: A place for things I think about, build, and find interesting.

# Your links. Leave any of them blank ("") and it simply won't show.
email: ""            # e.g. you@example.com
linkedin: "https://www.linkedin.com/in/pranav-sinkar/"
github: "https://github.com/P-sinkar"
substack: "https://substack.com/@pranavsinkar"

# Note shown at the bottom of every page. Delete the text (leave "") to hide it.
ai_note: "Apart from the home page, the About page and articles, the text on this site was drafted with AI so I could get it online quickly. I'm rewriting it in my own words over time."

# Quote shown on the home page.
quote: "Be curious, not judgmental."
quote_by: "Ted Lasso"

# Hosting.
# If your repo is named <username>.github.io, leave baseurl as "".
# If it's named anything else (e.g. "website"), set baseurl: "/website".
url: "https://pranavsinkar.com"
baseurl: ""

# Article URLs look like /writing/my-article-title/
permalink: /writing/:title/

# Every article gets a slim sea banner (its title stays with the article).
defaults:
  - scope:
      path: ""
      type: posts
    values:
      banner: writing
      banner_title: false

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - "*.txt"
